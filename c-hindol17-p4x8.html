<style>
/* Layout: 한 장짜리 현장 파일 — 머리 띠(현장·담당) 아래 세 장(상담·견적·진행)을 탭으로 넘기고, 장마다 '질문하기'가 붙는다 */
:root{
  --bg:#F4F1EC; --paper:#FCFAF6; --ink:#24221F; --muted:#6B655D; --line:#DCD4C8;
  --gold:#8A6633; --gold-soft:#EFE5D3; --done:#2E7356; --done-soft:#DDEDE4; --warn:#9A4A2E;
  --band:#1E1D1B; --band-ink:#F3EEE6; --band-muted:#B5AEA3;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311; --paper:#1D1B19; --ink:#ECE6DC; --muted:#A49D92; --line:#35312C;
  --gold:#CBA766; --gold-soft:#2E2618; --done:#63C196; --done-soft:#17302A; --warn:#E39072;
  --band:#0E0D0C; --band-ink:#F3EEE6; --band-muted:#A49D92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --paper:#1D1B19; --ink:#ECE6DC; --muted:#A49D92; --line:#35312C;
  --gold:#CBA766; --gold-soft:#2E2618; --done:#63C196; --done-soft:#17302A; --warn:#E39072;
  --band:#0E0D0C; --band-ink:#F3EEE6; --band-muted:#A49D92; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;word-break:keep-all}
.band{background:var(--band);color:var(--band-ink)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .wrap{padding-block:28px 0;display:grid;gap:14px}
.brand{font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:700}
.band h1{font-family:var(--f-display);font-size:clamp(24px,5.5vw,34px);line-height:1.3;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--band-muted)}
.meta b{color:var(--band-ink);font-weight:500}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{font:inherit;font-size:14px;background:none;border:0;color:var(--band-muted);padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--gold);font-weight:700}
main.wrap{padding-block:24px 64px;display:grid;gap:18px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:22px 20px;display:grid;gap:18px;min-width:0}
.sheet h2{font-family:var(--f-display);font-size:21px;margin:0}
.sheet h3{font-size:14px;margin:0;color:var(--gold);letter-spacing:.04em}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lead{margin:0;color:var(--ink)}
.muted{color:var(--muted);font-size:13px;margin:0}
ul.list{margin:0;padding-left:20px;display:grid;gap:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{display:grid;gap:8px;min-width:0}
.ask{font:inherit;font-size:13px;font-weight:500;background:var(--gold-soft);color:var(--gold);border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.ask:hover{border-color:var(--gold)}
.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;padding:9px 16px;cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--paper)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
table.ed{min-width:520px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbd{color:var(--muted);font-size:13px}
.sum{display:grid;gap:4px;justify-items:end;font-variant-numeric:tabular-nums}
.sum div{display:flex;gap:18px}
.sum .total{font-family:var(--f-display);font-size:22px;color:var(--gold)}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}
ol.rail{list-style:none;margin:0;padding:0;display:grid}
ol.rail li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
li.done .dot{background:var(--done);border-color:var(--done);color:var(--paper)}
li.now .dot{border-color:var(--gold);color:var(--gold)}
li.now .nm{font-weight:700}
.when{font-size:12px;color:var(--done);white-space:nowrap}
.memo{font-size:13px;color:var(--muted);grid-column:2/-1}
.qa{background:var(--band);color:var(--band-ink);border-radius:4px;padding:20px;display:grid;gap:10px}
.qa p{margin:0;color:var(--band-muted);font-size:14px}
.qa b{color:var(--band-ink)}
.qa .ask{background:var(--gold);color:var(--band);text-decoration:none;display:inline-block}
.ownerbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--gold-soft);border-radius:4px;padding:10px 14px;font-size:13px}
.ownerbar .acts{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.ed td{padding:6px 4px}
.ed input{min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--done)}
.note{font-size:13px;color:var(--warn);margin:0}
.want{border-top:1px solid var(--line);padding-top:18px;gap:14px}
fieldset.wg{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
fieldset.wg legend{font-size:13px;font-weight:700;padding:0;margin-bottom:6px}
.wi{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,42vw),1fr));gap:6px}
.wi label{display:flex;gap:8px;align-items:center;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);cursor:pointer}
.wi label:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.wi input{width:18px;height:18px;accent-color:var(--gold);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wopt{display:grid;gap:12px;background:var(--gold-soft);border-radius:4px;padding:12px}
.wq{display:grid;gap:6px}
.wqt{font-size:13px;font-weight:700;color:var(--gold)}
.wr{display:grid;gap:6px}
.wr label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);cursor:pointer}
.wr label:has(input:checked){border-color:var(--gold)}
.wr input{width:18px;height:18px;accent-color:var(--gold);flex:none;margin-top:3px}
.wr span{display:grid;gap:2px;min-width:0}
.wr small{font-size:12.5px;color:var(--muted);line-height:1.55}
footer.wrap{padding-block:0 40px;font-size:12px;color:var(--muted)}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.sheet{padding:18px 14px}}
</style>

    }
    return '<li class="' + cls + '"><span class="dot">' + (d ? "✓" : i + 1) + '</span><span class="nm">' + esc(name) + "</span>" +
      '<span class="when">' + (d ? fmt(d) + " 완료" : (i === nowI ? "진행 중 / 다음 차례" : "")) + "</span>" +
      (p.memo[i] ? '<span class="memo">' + esc(p.memo[i]) + "</span>" : "") + "</li>";
  }).join("");
  el.innerHTML = '<div class="head"><h2>' + (editing ? "진행 현황 편집" : "진행 현황") + "</h2>" + (editing ? "" : askBtn("진행 현황")) + "</div>" +
    '<div class="bar" role="progressbar" aria-label="공사 진행률" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div>' +
    '<p class="muted">진행률 ' + pct + "% · " + doneN + " / " + steps.length + " 단계 완료</p>" +
    '<ol class="rail">' + items + "</ol>";
}

function renderQA(){
  var el = $("#v-qa"), list = state.qa;
  if (editing) {
    el.innerHTML = '<div class="head"><h2>질문·답변 편집</h2></div>' +
      '<p class="muted">고객님께 받은 질문과 답변을 적어 두면 이 페이지에서 고객님이 바로 보실 수 있습니다. 위에 있을수록 최근 글입니다.</p>' +
      list.map(function(x, i){
        return '<div class="box" style="border-top:1px solid var(--line);padding-top:12px">' +
          '<label class="f">질문<input type="text" id="e-q-' + i + '" data-qi="' + i + '" data-qk="q" value="' + esc(x.q) + '"></label>' +
          '<label class="f">답변<textarea id="e-a2-' + i + '" data-qi="' + i + '" data-qk="a">' + esc(x.a) + '</textarea></label>' +
          '<div>' + (confirmDel === 1000 + i ? '<button class="btn danger" type="button" data-qdelyes="' + i + '">삭제</button>' : '<button class="btn" type="button" data-qdel="' + i + '">이 질문 삭제</button>') + '</div></div>';
      }).join("") +
      '<div><button class="btn" type="button" id="add-qa">+ 질문·답변 추가</button></div>';
    return;
  }
  el.innerHTML = '<div class="head"><h2>질문·답변</h2></div>' +
    (list.length ? list.map(function(x){
      return '<div class="box" style="border-top:1px solid var(--line);padding-top:14px">' +
        '<p style="margin:0;font-weight:700"><span style="color:var(--gold)">Q.</span> ' + esc(x.q) + '</p>' +
        (x.a ? '<p style="margin:0"><span style="color:var(--done);font-weight:700">A.</span> ' + esc(x.a) + '</p>' : '<p class="muted">답변을 준비하고 있습니다.</p>') +
        (x.date ? '<p class="muted">' + fmt(x.date) + '</p>' : '') + '</div>';
    }).join("") : '<p class="muted">아직 올라온 질문이 없습니다. 아래 <b>질문 보내기</b>로 궁금하신 점을 남겨 주시면 이곳에 답변을 올려 드립니다.</p>');
}

function newSlug(){
  var d = new Date(), r = Math.random().toString(36).slice(2, 6);
  return "c-" + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "-" + r;
}
function blankCustomer(){
  return {site:{name:"새 고객 현장", slug:newSlug(), type:"res", area:"", client:"", consultDate:today(), start:"", end:""},
    consult:{summary:"", scope:[], requests:[], next:["현장 실측·상태 진단","디자인·자재 선정 (실물 샘플 확인)","공정별 견적 확정·계약","착공일 확정"], decide:["착공 희망 시기","마감재 선택"]},
    quote:{status:"작성 중", items:[{g:"철거",name:"기존 마감재 철거, 폐기물 반출",amt:0},{g:"설비·전기",name:"배관, 전기 배선",amt:0},{g:"목공",name:"천장·몰딩·문틀",amt:0},{g:"욕실",name:"방수·타일·도기",amt:0},{g:"주방",name:"주방 가구·상판",amt:0},{g:"도배",name:"도배",amt:0},{g:"바닥",name:"바닥재·걸레받이",amt:0},{g:"마감",name:"조명·청소",amt:0}], vat:true, note:"금액은 현장 실측 후 공정별로 확정해 안내해 드립니다."},
    progress:{done:{}, memo:{}}, qa:[], updated:""};
}
function makerBar(bar){
  var kindTxt = isIntro() ? "첫 상담 안내 페이지" : "고객 전용 페이지";
  bar.innerHTML = editing
    ? '<span>편집 중 · ' + kindTxt + '</span><span class="acts"><button class="btn" type="button" id="cancel-edit">취소</button><button class="btn primary" type="button" id="apply-edit">편집 완료</button></span>'
    : '<span><b>고객 페이지 만들기</b> · 지금 화면: ' + kindTxt + ' <b>' + esc(state.site.name || "") + '</b></span>' +
      '<span class="acts"><button class="btn" type="button" id="mk-new">새 고객으로 시작</button><button class="btn" type="button" id="mk-load">고객 파일 불러오기</button><button class="btn" type="button" id="start-edit">내용 편집</button>' +
      (downloadsNs ? '<button class="btn primary" type="button" id="dl-file">고객용 파일 받기</button>' : '') + '</span>' +
      '<span class="muted" style="flex-basis:100%">고객 링크: thebuildtop.github.io/' + esc(state.site.slug || "") + '.html — 받은 파일을 GitHub에 올리면 이 주소로 열립니다. 고객이 바뀌면 <b>새 고객으로 시작</b>을 눌러 새 주소로 만드세요.</span>' +
      '<span class="muted" id="dl-msg" role="status" style="flex-basis:100%"></span>';
}

function renderOwnerBar(){
  var bar = $("#ownerbar");
  if (!isOwner) { bar.hidden = true; return; }
  bar.hidden = false;
  if (MAKER) { makerBar(bar); return; }
  bar.innerHTML = editing
    ? '<span>편집 중입니다. 저장해야 고객님 화면에 반영됩니다.</span><span class="acts"><button class="btn" type="button" id="cancel-edit">취소</button><button class="btn primary" type="button" id="save">저장해서 고객에게 보이기</button></span>'
    : '<span>대표님 화면입니다. 고객님은 이 줄과 편집 버튼을 보지 못합니다.' + (downloadsNs ? ' 저장한 뒤 <b>고객용 파일</b>을 받아 홈페이지(GitHub)에 같은 이름으로 올리면 고객 링크가 바뀝니다.' : '') + '</span><span class="acts">' + (downloadsNs ? '<button class="btn" type="button" id="dl-file">고객용 파일 받기</button>' : '') + '<button class="btn primary" type="button" id="start-edit">내용 편집</button></span>' + (state.site.slug ? '<span class="muted" style="flex-basis:100%">고객 링크: thebuildtop.github.io/' + esc(state.site.slug) + '.html</span>' : '') + '<span class="muted" id="dl-msg" role="status" style="flex-basis:100%"></span>';
}

function render(){
  if (isIntro() && view === "quote") view = "consult";
  renderHead(); renderConsult(); renderQuote(); renderProgress(); renderQA(); renderOwnerBar();
  $("#t-quote").hidden = isIntro();
  $("#copy-site").hidden = isIntro();
  $("#t-consult").textContent = isIntro() ? "상담 안내" : "상담 내용";
  $("#t-progress").textContent = isIntro() ? "공사 진행 순서" : "진행 현황";
  ["consult","quote","progress","qa"].forEach(function(v){
    $("#v-" + v).hidden = v !== view;
    $("#t-" + v).setAttribute("aria-selected", v === view);
  });
}

function readEdits(){
  var v = function(id){ var n = document.getElementById(id); return n ? n.value : undefined; };
  if (isIntro() && view === "consult" && document.getElementById("e-name")) {
    state.site.name = v("e-name").trim(); state.consult.summary = v("e-summary").trim();
    state.consult.scope = lines(v("e-scope")); state.consult.next = lines(v("e-next")); state.consult.decide = lines(v("e-decide"));
    return;
  }
  if (view === "consult" && document.getElementById("e-name")) {
    var s = state.site, c = state.consult;
    s.name = v("e-name").trim(); s.client = v("e-client").trim(); s.type = v("e-type"); s.area = v("e-area").trim();
    s.consultDate = v("e-cdate"); s.start = v("e-start"); s.end = v("e-end");
    c.summary = v("e-summary").trim(); c.scope = lines(v("e-scope")); c.requests = lines(v("e-requests")); c.next = lines(v("e-next")); c.decide = lines(v("e-decide"));
  }
  if (view === "quote" && document.getElementById("e-qstatus")) {
    state.quote.status = v("e-qstatus"); state.quote.vat = document.getElementById("e-vat").checked; state.quote.note = v("e-qnote").trim();
  }
}

document.addEventListener("click", function(e){
  var ws = e.target.closest("#w-send");
  if (ws) {
    copyText(wantText()).then(function(ok){ var m = $("#w-msg"); if (m) m.textContent = ok ? "선택 내용을 복사했습니다. 열린 신청서의 문의 내용 칸에 붙여 넣고 제출해 주세요." : "열린 신청서에 위에서 고른 공사를 적어 주세요."; });
    return;
  }
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.v) { if (editing) readEdits(); view = t.dataset.v; confirmDel = -1; render(); return; }
  if (t.id === "w-copy") {
    copyText(wantText()).then(function(ok){
      var m = $("#w-msg");
      if (m) m.textContent = ok ? "선택 내용을 복사했습니다. 문자나 카카오톡으로 010-5467-9349에 보내 주셔도 됩니다." : "복사가 되지 않는 화면입니다. 고른 공사를 010-5467-9349로 문자 주세요.";
    });
    return;
  }
  if (t.id === "copy-site") {
    var txt = "현장: " + (state.site.name || "");
    var done = function(ok){ $("#copy-msg").textContent = ok ? "현장 이름을 복사했습니다. 질문 내용 맨 앞에 붙여 넣어 주세요." : txt + " — 질문 내용에 함께 적어 주세요."; };
    try { navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); }); } catch(err) { done(false); }
    return;
  }
  if (t.id === "add-qa") { state.qa.unshift({q:"", a:"", date: today()}); render(); var q0 = document.getElementById("e-q-0"); if (q0) q0.focus(); return; }
  if (t.dataset.qdel) { confirmDel = 1000 + Number(t.dataset.qdel); render(); return; }
  if (t.dataset.qdelyes) { state.qa.splice(Number(t.dataset.qdelyes), 1); confirmDel = -1; render(); return; }
  if (t.id === "start-edit") { state = JSON.parse(JSON.stringify(state)); window.__backup = JSON.stringify(state); editing = true; render(); return; }
  if (t.id === "cancel-edit") { state = JSON.parse(window.__backup); editing = false; confirmDel = -1; render(); return; }
  if (t.id === "save") { readEdits(); save(t); return; }
  if (t.id === "apply-edit") { readEdits(); state.qa = state.qa.filter(function(x){ return (x.q || "").trim() || (x.a || "").trim(); }); state.updated = today(); editing = false; loadPicks(); render(); return; }
  if (t.id === "mk-new") { state = blankCustomer(); view = "consult"; loadPicks(); editing = true; window.__backup = JSON.stringify(state); render(); var n0 = document.getElementById("e-name"); if (n0) { n0.focus(); n0.select(); } return; }
  if (t.id === "mk-load") { var fi = document.getElementById("load-file"); if (fi) fi.click(); return; }
  if (t.dataset.itype) { itype = t.dataset.itype; savePicks(); rerenderWant(); renderProgress(); return; }
  if (t.id === "dl-file") {
    if (!downloadsNs) return;
    downloadsNs.save({filename: (state.site.slug || "customer") + ".html", data: buildDoc(true)}).then(function(){
      var m = $("#dl-msg"); if (m) m.textContent = "파일을 받았습니다. GitHub 저장소에 Add file → Upload files로 올려 주세요.";
    }, function(){ var m = $("#dl-msg"); if (m) m.textContent = "파일을 받지 않았습니다. 다시 눌러 주세요."; });
    return;
  }
  if (t.id === "add-row") { readEdits(); state.quote.items.push({g:"", name:"", amt:0}); render(); var n = document.getElementById("e-g-" + (state.quote.items.length - 1)); if (n) n.focus(); return; }
  if (t.dataset.del) { readEdits(); confirmDel = Number(t.dataset.del); render(); return; }
  if (t.dataset.delyes) { readEdits(); state.quote.items.splice(Number(t.dataset.delyes), 1); confirmDel = -1; render(); return; }
});
document.addEventListener("input", function(e){
  var t = e.target;
  if (t.dataset.k) { var it = state.quote.items[Number(t.dataset.i)]; it[t.dataset.k] = t.dataset.k === "amt" ? (Number(t.value) || 0) : t.value; }
  if (t.id === "w-note") { wishNote = t.value; }
  if (t.dataset.info) { info[t.dataset.info] = t.value; savePicks(); }
  if (t.dataset.qk) { state.qa[Number(t.dataset.qi)][t.dataset.qk] = t.value; }
  if (t.dataset.memo) { var k = t.dataset.memo; if (t.value.trim()) state.progress.memo[k] = t.value; else delete state.progress.memo[k]; }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "load-file" && t.files && t.files[0]) {
    var rd = new FileReader();
    rd.onload = function(){
      var m = String(rd.result).match(/id="state">([\s\S]*?)<\/script>/), msg = $("#dl-msg");
      try { var ns = JSON.parse(m[1]); delete ns.maker; if (!ns.site) throw 0; state = ns; if (!state.site.slug) state.site.slug = newSlug(); if (!Array.isArray(state.qa)) state.qa = []; view = "consult"; editing = false; loadPicks(); render(); msg = $("#dl-msg"); if (msg) msg.textContent = "불러왔습니다: " + (state.site.name || ""); }
      catch(err) { if (msg) msg.textContent = "더빌드탑 고객 파일이 아닙니다. 고객용 파일 받기로 만든 .html 파일을 골라 주세요."; }
      t.value = "";
    };
    rd.readAsText(t.files[0]);
    return;
  }
  if (t.dataset.info) { info[t.dataset.info] = t.value; savePicks(); return; }
  if (t.dataset.want) {
    if (t.checked) picks[t.dataset.want] = 1; else delete picks[t.dataset.want];
    if (!t.checked) delete opts[t.dataset.want];
    savePicks();
    if (OPTS[t.dataset.want]) { var fid = t.id; rerenderWant(); var f = document.getElementById(fid); if (f) f.focus(); }
    else { var cnt = document.querySelector("#want .head .muted"); if (cnt) cnt.textContent = Object.keys(picks).length + "개 선택"; }
    return;
  }
  if (t.dataset.optItem) {
    var it = t.dataset.optItem; opts[it] = opts[it] || {}; opts[it][t.dataset.optQ] = t.value; savePicks();
    return;
  }
  if (t.dataset.step) {
    var i = t.dataset.step;
    if (t.checked) state.progress.done[i] = today(); else delete state.progress.done[i];
    var memos = {}; document.querySelectorAll("[data-memo]").forEach(function(n){ memos[n.id] = n.value; });
    renderProgress();
    Object.keys(memos).forEach(function(id){ var n = document.getElementById(id); if (n) n.value = memos[id]; });
  }
});

function buildDoc(forFile){
  var json = JSON.stringify(state).replace(/</g, "\\u003c");
  var i = BODY_SRC.indexOf(M1), j = BODY_SRC.indexOf(M2);
  var body = BODY_SRC.slice(0, i) + M1 + '<script type="application/json" id="state">' + json + "</scr" + "ipt>" + BODY_SRC.slice(j);
  var reset = (document.head.querySelector("style") || {}).textContent || "";
  if (forFile) {
    var ttl = esc(state.site.name || "더빌드탑") + (isIntro() ? "" : " 고객 페이지");
    body = body.replace(/<title>[\s\S]*?<\/title>/, "<title>" + ttl + "</title>");
    return '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>' + ttl + '</title><style>' + reset + "</style></head><body>" + body + "</body></html>";
  }
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" + body + "</body></html>";
}
function save(btn){
  if (!artifactNs) return;
  btn.disabled = true; btn.textContent = "저장 중…";
  state.qa = state.qa.filter(function(x){ return (x.q || "").trim() || (x.a || "").trim(); });
  state.updated = today();
  artifactNs.publish(buildDoc()).then(function(){ editing = false; render(); }, function(err){
    if (err && err.code === "conflict") return;
    btn.disabled = false; btn.textContent = "다시 저장";
    var n = document.getElementById("ownerbar");
    if (n && !n.querySelector(".note")) n.insertAdjacentHTML("beforeend", '<p class="note">저장하지 못했습니다. 잠시 뒤 다시 저장해 주세요.</p>');
  });
}

render();

(function(){
  if (!window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function(r){
    var a = r[0], u = r[1]; if (!u) return;
    return u.isOwner().then(function(o){
      if (!o) return;
      artifactNs = MAKER ? null : a; isOwner = true; render();
      return window.claude.use("downloads").then(function(d){ if (d) { downloadsNs = d; render(); } }, function(){});
    });
  }).catch(function(){});
})();
})();
</script>

</body>
